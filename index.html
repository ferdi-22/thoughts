<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gedanken">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gedankenblitz</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --text:#e2e8f0; --muted:#94a3b8;
    --accent:#f59e0b; --err:#ef4444; --border:#334155;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f8fafc; --card:#ffffff; --card2:#f1f5f9; --text:#0f172a; --muted:#64748b; --border:#e2e8f0; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:16px}
  body{display:flex; flex-direction:column; height:100dvh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{display:flex; align-items:center; justify-content:space-between; padding:12px 16px;
    border-bottom:1px solid var(--border); flex:none}
  header h1{font-size:1.2rem; margin:0}
  header .sub{font-size:.8rem; color:var(--muted)}
  header .ver{opacity:.7; font-variant-numeric:tabular-nums}
  .newbtn{background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:999px;
    padding:6px 12px; font-size:.85rem; cursor:pointer; vertical-align:middle}
  .iconbtn{background:none; border:none; color:var(--text); font-size:1.3rem; padding:6px; cursor:pointer}

  #chat{flex:1; overflow-y:auto; padding:16px}
  .wrap{max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:10px}
  .msg{max-width:85%; padding:10px 14px; border-radius:18px; line-height:1.4; white-space:pre-wrap; word-wrap:break-word}
  .msg.me{align-self:flex-end; background:var(--accent); color:#111; border-bottom-right-radius:6px}
  .msg.ai{align-self:flex-start; background:var(--card); border:1px solid var(--border); border-bottom-left-radius:6px}
  .msg.err{align-self:flex-start; background:transparent; border:1px solid var(--err); color:var(--err); font-size:.9rem}
  .msg .lang{display:block; font-size:.7rem; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin-bottom:4px}
  .msg .tools{display:flex; gap:6px; margin-top:8px}
  .msg .tools button{background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:10px;
    padding:4px 10px; font-size:.8rem; cursor:pointer}
  .empty{text-align:center; color:var(--muted); padding:40px 16px; line-height:1.5}
  .typing{display:inline-flex; gap:4px}
  .typing i{width:7px; height:7px; border-radius:50%; background:var(--muted); animation:blink 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  form{flex:none; border-top:1px solid var(--border); padding:10px 12px; background:var(--bg)}
  form .row{max-width:720px; margin:0 auto; display:flex; gap:8px; align-items:flex-end}
  textarea{flex:1; resize:none; max-height:40vh; min-height:46px; background:var(--card2); color:var(--text);
    border:1px solid var(--border); border-radius:14px; padding:12px; font:inherit}
  input,select{background:var(--card2); color:var(--text); border:1px solid var(--border);
    border-radius:12px; padding:11px 12px; font-size:1rem; width:100%}
  button.btn{background:var(--card2); color:var(--text); border:1px solid var(--border);
    border-radius:12px; padding:10px 14px; font-size:.95rem; cursor:pointer}
  button.primary{background:var(--accent); color:#111; border-color:var(--accent); font-weight:600}
  #sendBtn{height:46px; width:52px; font-size:1.2rem}
  #sendBtn:disabled{opacity:.5}
  .small{font-size:.85rem; color:var(--muted)}

  dialog{background:var(--card); color:var(--text); border:none; border-radius:18px; padding:20px; width:min(92vw,480px)}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  dialog label{display:block; margin:14px 0 6px; font-weight:600}
  dialog a{color:var(--accent)}
  .actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px}
  #testOut{margin-top:8px; min-height:1.2em}
  .fix{align-self:flex-end; max-width:85%; margin-top:-4px; font-size:.85rem; background:var(--card);
    border:1px dashed var(--accent); border-radius:12px; padding:8px 12px; line-height:1.35}
  .fix .why{color:var(--muted); margin-top:4px}
  .msg .de{margin-top:8px; padding-top:8px; border-top:1px solid var(--border); color:var(--muted); font-size:.9rem}
  .starters{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:18px}
  .starters button{background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:999px;
    padding:8px 14px; font-size:.9rem; cursor:pointer}
</style>
</head>
<body>

<header>
  <div>
    <h1>⚡ Gedankenblitz</h1>
    <div class="sub">Englisch üben im Chat mit Sam <span class="ver" id="ver"></span></div>
  </div>
  <div>
    <button class="newbtn" id="clearBtn" title="Gespräch neu starten">↺ Neu</button>
    <button class="iconbtn" id="settingsBtn" aria-label="Einstellungen" title="Einstellungen">⚙️</button>
  </div>
</header>

<main id="chat"><div class="wrap" id="list"></div></main>

<form id="form">
  <div class="row">
    <textarea id="input" rows="1" placeholder="Nachricht eingeben …" enterkeyhint="send"></textarea>
    <button class="btn primary" id="sendBtn" type="submit" aria-label="Senden">➤</button>
  </div>
</form>

<dialog id="settings">
  <h3 style="margin-top:0">Einstellungen</h3>
  <label for="keyIn">Gemini API-Schlüssel</label>
  <input id="keyIn" type="password" autocomplete="off" placeholder="AIza… oder AQ.…">
  <div class="small" style="margin-top:6px">Kostenlos erstellen unter
    <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.
    Der Schlüssel bleibt nur auf diesem Gerät.</div>
  <label for="levelIn">Dein Englisch-Niveau</label>
  <select id="levelIn">
    <option value="A2">Anfänger (A2) – einfache Sätze</option>
    <option value="B1">Mittel (B1) – Alltagsenglisch</option>
    <option value="B2">Gut (B2) – natürlich, mit Redewendungen</option>
    <option value="C1">Sehr gut (C1) – wie mit Muttersprachlern</option>
  </select>
  <label for="modelIn">KI-Modell</label>
  <select id="modelIn"></select>
  <div class="small" style="margin-top:6px">„Automatisch“ nimmt ein verfügbares Modell und weicht bei Überlastung auf ein anderes aus.</div>
  <div class="actions">
    <button class="btn" id="testBtn" type="button">Verbindung testen</button>
  </div>
  <div class="small" id="testOut"></div>
  <div class="actions">
    <button class="btn primary" id="saveBtn" type="button">Speichern</button>
    <button class="btn" id="closeBtn" type="button">Schließen</button>
  </div>
</dialog>

<script>
/* Gedankenblitz – Englisch-Gesprächspartner zum Üben (Google Gemini).
   Alles läuft im Browser; Verlauf und Schlüssel liegen im localStorage. */

/* Versionsnummer: MAJOR.MINOR.PATCH – bei jeder Änderung erhöhen!
   PATCH (1.4.0 → 1.4.1): kleine Korrekturen, z. B. Texte, Stimme, Farben
   MINOR (1.4.1 → 1.5.0): neue Funktion
   MAJOR (1.5.0 → 2.0.0): App grundlegend umgebaut */
const APP_VERSION = '1.4.0';

const DEFAULT_MODEL = 'auto';
const API = 'https://generativelanguage.googleapis.com/v1beta';
// Reihenfolge für „Automatisch“, falls die Modellliste nicht geladen werden kann
const FALLBACK_MODELS = ['gemini-flash-lite-latest', 'gemini-flash-latest', 'gemini-2.5-flash-lite', 'gemini-2.5-flash', 'gemini-2.0-flash'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const getKey   = () => store.get('gb_key', '').trim();
const getModel = () => store.get('gb_model_v2', DEFAULT_MODEL);

let messages = [];
try { messages = JSON.parse(store.get('gb_talk', '[]')) || []; } catch { messages = []; }
const save = () => store.set('gb_talk', JSON.stringify(messages.slice(-200)));

const getLevel = () => store.get('gb_level', 'B1');
const STARTERS = ['Hi! How are you today?', 'What did you do last weekend?', 'Can you recommend a good movie?', 'Ich möchte über meinen Job reden.'];

/* ---------- Anzeige ---------- */
function render(pending = false) {
  const list = $('#list');
  if (!messages.length && !pending) {
    list.innerHTML = `<div class="empty">👋 Chatte auf Englisch mit deinem Gesprächspartner <b>Sam</b>.<br>
      Fehler werden dezent verbessert. Wenn dir ein Wort fehlt, schreib es einfach auf Deutsch.
      ${getKey() ? '' : '<br><br>Zuerst unter ⚙️ den Gemini-Schlüssel eintragen.'}
      <div class="starters">${STARTERS.map(s => `<button data-start="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`;
    return;
  }
  list.innerHTML = messages.map((m, i) => {
    if (m.role === 'me') return `<div class="msg me">${esc(m.text)}</div>` + (m.fix ? `<div class="fix">
      <b>✏️ Besser:</b> ${esc(m.fix)}${m.why ? `<div class="why">${esc(m.why)}</div>` : ''}</div>` : '');
    if (m.role === 'err') return `<div class="msg err">⚠️ ${esc(m.text)}</div>`;
    return `<div class="msg ai">${esc(m.text)}${m.de ? `<div class="de" id="de${i}" hidden>🇩🇪 ${esc(m.de)}</div>` : ''}
      <div class="tools"><button data-speak="${i}">🔊</button>${m.de ? `<button data-de="${i}">🇩🇪 Deutsch</button>` : ''}<button data-copy="${i}">Kopieren</button></div></div>`;
  }).join('') + (pending ? '<div class="msg ai"><span class="typing"><i></i><i></i><i></i></span></div>' : '');
  const chat = $('#chat'); chat.scrollTop = chat.scrollHeight;
}

$('#list').addEventListener('click', async e => {
  const { copy: c, speak: s, de, start } = e.target.dataset;
  if (start) { input.value = start; autosize(); $('#form').requestSubmit(); }
  if (de != null) { const d = $('#de' + de); d.hidden = !d.hidden; }
  if (c != null) {
    try { await navigator.clipboard.writeText(messages[c].text); e.target.textContent = 'Kopiert ✓'; }
    catch { e.target.textContent = 'Nicht möglich'; }
    setTimeout(() => (e.target.textContent = 'Kopieren'), 1500);
  }
  if (s != null && 'speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(messages[s].text);
    u.lang = 'en-US';
    const voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
    u.voice = voices.find(v => /Natural|Premium|Enhanced|Google/.test(v.name)) || voices[0];
    u.rate = 0.95;   // etwas langsamer = leichter zu verstehen
    speechSynthesis.speak(u);

  }
});

/* ---------- KI ---------- */
const LEVELS = {
  A2: 'a beginner (CEFR A2): use very simple words and short sentences',
  B1: 'an intermediate learner (CEFR B1): use everyday language, avoid rare idioms',
  B2: 'an upper-intermediate learner (CEFR B2): speak naturally, occasional idioms are fine',
  C1: 'an advanced learner (CEFR C1): speak like a native speaker would with a friend',
};
const systemPrompt = () => `You are Sam, a friendly, curious native English speaker chatting with a German speaker who wants to improve their English.
The learner is ${LEVELS[getLevel()] || LEVELS.B1}.

How to reply ("reply"):
- Answer like a real human in a casual chat: natural, warm, with your own opinions and small stories. Never say you are an AI or a language model.
- Keep it short (1–4 sentences), like a text message. Usually end with a question or something that keeps the conversation going.
- Always reply in English, even if the learner writes German. If they write German, gently show how to say it in English as part of the chat.
- Do not lecture about grammar inside "reply" – corrections go into the separate fields.

Feedback on the learner's LAST message:
- "correction": the learner's message rewritten in correct, natural English. If they wrote German, this is the English version.
  Leave it EMPTY if the message was already correct and natural (ignore tiny things like missing capital letters or punctuation).
- "explanation": if there is a correction, 1–2 short sentences IN GERMAN explaining the main mistake(s). Otherwise empty.
- "reply_de": a German translation of your reply.`;

const SCHEMA = {
  type: 'OBJECT',
  properties: {
    reply: { type: 'STRING' },
    correction: { type: 'STRING' },
    explanation: { type: 'STRING' },
    reply_de: { type: 'STRING' },
  },
  required: ['reply', 'correction', 'explanation', 'reply_de'],
};

/* Gesprächsverlauf für die KI (die letzten 30 Nachrichten, ohne Fehlermeldungen) */
function history() {
  const h = messages.filter(m => m.role !== 'err').slice(-30)
    .map(m => ({ role: m.role === 'me' ? 'user' : 'model', parts: [{ text: m.text }] }));
  while (h.length && h[0].role !== 'user') h.shift();   // Gemini will mit „user“ beginnen
  return h;
}

/* Verfügbare Modelle beim eigenen Schlüssel abfragen (Text-Modelle mit generateContent). */
let available = [];
try { available = JSON.parse(store.get('gb_models', '[]')) || []; } catch {}
async function loadModels(key = getKey()) {
  if (!key) return available;
  try {
    const res = await fetch(`${API}/models?pageSize=1000`, { headers: { 'x-goog-api-key': key } });
    if (!res.ok) return available;
    const json = await res.json();
    const skip = /(tts|image|embed|live|audio|robotics|computer|vision|aqa|learnlm|gemma|veo|imagen|thinking|exp)/i;
    available = (json.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => m.name.replace(/^models\//, ''))
      .filter(n => n.startsWith('gemini') && !skip.test(n));
    // schnelle Modelle zuerst: flash-lite, dann flash, dann der Rest
    const rank = n => (/flash-lite/.test(n) ? 0 : /flash/.test(n) ? 1 : 2) + (/preview/.test(n) ? 0.5 : 0);
    available.sort((a, b) => rank(a) - rank(b) || b.localeCompare(a));
    store.set('gb_models', JSON.stringify(available));
  } catch {}
  return available;
}
function fillModelSelect(selected = getModel()) {
  const opts = ['auto', ...new Set([...(available.length ? available : FALLBACK_MODELS), selected].filter(m => m && m !== 'auto'))];
  $('#modelIn').innerHTML = opts.map(m => `<option value="${esc(m)}">${m === 'auto' ? 'Automatisch (empfohlen)' : esc(m)}</option>`).join('');
  $('#modelIn').value = selected;
}
function candidates(model) {
  const pool = available.length ? available : FALLBACK_MODELS;
  return [...new Set(model === 'auto' ? pool : [model, ...pool])].slice(0, 5);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function ask(contents, model = getModel()) {
  if (!getKey()) throw new Error('Kein API-Schlüssel eingetragen. Bitte unter ⚙️ eintragen.');
  let lastErr;
  for (const m of candidates(model)) {
    try { return await askWith(contents, m); }
    catch (err) {
      lastErr = err;
      if (!err.retry) throw err;           // z. B. falscher Schlüssel → nicht weiter probieren
      await sleep(600);
    }
  }
  throw lastErr;
}

async function askWith(contents, model) {
  const key = getKey();
  const url = `${API}/models/${encodeURIComponent(model)}:generateContent`;
  const body = {
    systemInstruction: { parts: [{ text: systemPrompt() }] },
    contents,
    generationConfig: { temperature: 0.8, responseMimeType: 'application/json', responseSchema: SCHEMA },
  };
  let res;
  try {
    res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify(body) });
  } catch { throw new Error('Keine Verbindung zur KI. Bist du online?'); }
  const json = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = json.error?.message || res.statusText || 'unbekannt';
    const fail = (text, retry) => Object.assign(new Error(text), { retry });
    if (res.status === 401 || res.status === 403 || /API key/i.test(msg))
      throw fail('API-Schlüssel wird nicht akzeptiert. Bitte unter ⚙️ prüfen. (' + msg + ')', false);
    if (res.status === 429) throw fail('Kostenloses Limit erreicht – bitte eine Minute warten. (' + model + ')', true);
    if (res.status === 404) throw fail(`Modell „${model}“ gibt es nicht (mehr).`, true);
    if (res.status >= 500) throw fail(`Google-Server gerade überlastet (${model}) – bitte gleich nochmal versuchen.`, true);
    throw fail(`KI-Fehler ${res.status} (${model}): ${msg}`, false);
  }
  const cand = json.candidates?.[0];
  const out = (cand?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('').trim();
  if (!out) throw Object.assign(new Error('Leere Antwort von der KI' + (cand?.finishReason ? ` (${cand.finishReason})` : json.promptFeedback?.blockReason ? ` (${json.promptFeedback.blockReason})` : '') + '.'), { retry: true });
  let data;
  try { data = JSON.parse(out); } catch { data = { reply: out }; }   // falls das Modell kein JSON liefert
  if (!data.reply?.trim()) throw Object.assign(new Error('Leere Antwort von der KI.'), { retry: true });
  lastModel = model;
  return data;
}

/* ---------- Senden ---------- */
const input = $('#input');
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, innerHeight * 0.4) + 'px'; }
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(pointer:fine)').matches) {
    e.preventDefault(); $('#form').requestSubmit();
  }
});

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  if (!getKey()) { openSettings(); return; }
  const mine = { role: 'me', text };
  messages.push(mine); save();
  input.value = ''; autosize();
  $('#sendBtn').disabled = true; render(true);
  try {
    const r = await ask(history());
    const fix = (r.correction || '').trim();
    if (fix && fix.toLowerCase().replace(/[^a-z0-9]/g, '') !== text.toLowerCase().replace(/[^a-z0-9]/g, '')) {
      mine.fix = fix; mine.why = (r.explanation || '').trim();
    }
    messages.push({ role: 'ai', text: r.reply.trim(), de: (r.reply_de || '').trim() });
  }
  catch (err) { console.error(err); messages.push({ role: 'err', text: err.message || String(err) }); }
  save(); $('#sendBtn').disabled = false; render(); input.focus();
});

// Gespräch neu starten: Verlauf leeren, Sam fängt von vorn an
$('#clearBtn').addEventListener('click', () => {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  messages = []; save(); render(); input.focus();
});

/* ---------- Einstellungen ---------- */
let lastModel = '';
function openSettings() {
  $('#keyIn').value = getKey(); $('#levelIn').value = getLevel(); fillModelSelect(); $('#testOut').textContent = '';
  $('#settings').showModal();
}
$('#settingsBtn').addEventListener('click', openSettings);
$('#closeBtn').addEventListener('click', () => $('#settings').close());
$('#saveBtn').addEventListener('click', () => {
  store.set('gb_key', $('#keyIn').value.trim());
  store.set('gb_model_v2', $('#modelIn').value);
  store.set('gb_level', $('#levelIn').value);
  $('#settings').close(); render();
});
$('#testBtn').addEventListener('click', async () => {
  const out = $('#testOut'), old = getKey();
  store.set('gb_key', $('#keyIn').value.trim());
  out.textContent = 'Lade verfügbare Modelle …';
  const sel = $('#modelIn').value;
  await loadModels(); fillModelSelect(sel);
  out.textContent = `Teste (${available.length || FALLBACK_MODELS.length} Modelle verfügbar) …`;
  try {
    const r = await ask([{ role: 'user', parts: [{ text: 'Hi, how are you?' }] }], sel);
    out.textContent = `✅ Klappt mit ${lastModel}: „${r.reply}“`;
  }
  catch (err) { out.textContent = '❌ ' + err.message; store.set('gb_key', old); }
});

$('#ver').textContent = 'v' + APP_VERSION;
render();
if (!getKey()) openSettings(); else loadModels();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=' + APP_VERSION).catch(() => {});
</script>
</body>
</html>
