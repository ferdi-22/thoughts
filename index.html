<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gedanken">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gedankenblitz</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --text:#e2e8f0; --muted:#94a3b8;
    --accent:#f59e0b; --err:#ef4444; --border:#334155;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f8fafc; --card:#ffffff; --card2:#f1f5f9; --text:#0f172a; --muted:#64748b; --border:#e2e8f0; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:16px}
  body{display:flex; flex-direction:column; height:100dvh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{display:flex; align-items:center; justify-content:space-between; padding:12px 16px;
    border-bottom:1px solid var(--border); flex:none}
  header h1{font-size:1.2rem; margin:0}
  header .sub{font-size:.8rem; color:var(--muted)}
  .iconbtn{background:none; border:none; color:var(--text); font-size:1.3rem; padding:6px; cursor:pointer}

  #chat{flex:1; overflow-y:auto; padding:16px}
  .wrap{max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:10px}
  .msg{max-width:85%; padding:10px 14px; border-radius:18px; line-height:1.4; white-space:pre-wrap; word-wrap:break-word}
  .msg.me{align-self:flex-end; background:var(--accent); color:#111; border-bottom-right-radius:6px}
  .msg.ai{align-self:flex-start; background:var(--card); border:1px solid var(--border); border-bottom-left-radius:6px}
  .msg.err{align-self:flex-start; background:transparent; border:1px solid var(--err); color:var(--err); font-size:.9rem}
  .msg .lang{display:block; font-size:.7rem; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin-bottom:4px}
  .msg .tools{display:flex; gap:6px; margin-top:8px}
  .msg .tools button{background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:10px;
    padding:4px 10px; font-size:.8rem; cursor:pointer}
  .empty{text-align:center; color:var(--muted); padding:40px 16px; line-height:1.5}
  .typing{display:inline-flex; gap:4px}
  .typing i{width:7px; height:7px; border-radius:50%; background:var(--muted); animation:blink 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  form{flex:none; border-top:1px solid var(--border); padding:10px 12px; background:var(--bg)}
  form .row{max-width:720px; margin:0 auto; display:flex; gap:8px; align-items:flex-end}
  textarea{flex:1; resize:none; max-height:40vh; min-height:46px; background:var(--card2); color:var(--text);
    border:1px solid var(--border); border-radius:14px; padding:12px; font:inherit}
  input,select{background:var(--card2); color:var(--text); border:1px solid var(--border);
    border-radius:12px; padding:11px 12px; font-size:1rem; width:100%}
  button.btn{background:var(--card2); color:var(--text); border:1px solid var(--border);
    border-radius:12px; padding:10px 14px; font-size:.95rem; cursor:pointer}
  button.primary{background:var(--accent); color:#111; border-color:var(--accent); font-weight:600}
  #sendBtn{height:46px; width:52px; font-size:1.2rem}
  #sendBtn:disabled{opacity:.5}
  .small{font-size:.85rem; color:var(--muted)}

  dialog{background:var(--card); color:var(--text); border:none; border-radius:18px; padding:20px; width:min(92vw,480px)}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  dialog label{display:block; margin:14px 0 6px; font-weight:600}
  dialog a{color:var(--accent)}
  .actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px}
  #testOut{margin-top:8px; min-height:1.2em}
</style>
</head>
<body>

<header>
  <div>
    <h1>⚡ Gedankenblitz</h1>
    <div class="sub">Schreib etwas – du bekommst es auf Englisch zurück.</div>
  </div>
  <div>
    <button class="iconbtn" id="clearBtn" aria-label="Verlauf löschen" title="Verlauf löschen">🗑️</button>
    <button class="iconbtn" id="settingsBtn" aria-label="Einstellungen" title="Einstellungen">⚙️</button>
  </div>
</header>

<main id="chat"><div class="wrap" id="list"></div></main>

<form id="form">
  <div class="row">
    <textarea id="input" rows="1" placeholder="Nachricht eingeben …" enterkeyhint="send"></textarea>
    <button class="btn primary" id="sendBtn" type="submit" aria-label="Senden">➤</button>
  </div>
</form>

<dialog id="settings">
  <h3 style="margin-top:0">Einstellungen</h3>
  <label for="keyIn">Gemini API-Schlüssel</label>
  <input id="keyIn" type="password" autocomplete="off" placeholder="AIza… oder AQ.…">
  <div class="small" style="margin-top:6px">Kostenlos erstellen unter
    <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.
    Der Schlüssel bleibt nur auf diesem Gerät.</div>
  <label for="modelIn">KI-Modell</label>
  <select id="modelIn">
    <option value="gemini-2.5-flash">gemini-2.5-flash (empfohlen)</option>
    <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite (schneller)</option>
    <option value="gemini-flash-latest">gemini-flash-latest</option>
    <option value="gemini-flash-lite-latest">gemini-flash-lite-latest</option>
  </select>
  <div class="actions">
    <button class="btn" id="testBtn" type="button">Verbindung testen</button>
  </div>
  <div class="small" id="testOut"></div>
  <div class="actions">
    <button class="btn primary" id="saveBtn" type="button">Speichern</button>
    <button class="btn" id="closeBtn" type="button">Schließen</button>
  </div>
</dialog>

<script>
/* Gedankenblitz – Chat, der jede Nachricht ins Englische übersetzt (Google Gemini).
   Alles läuft im Browser; Verlauf und Schlüssel liegen im localStorage. */

const DEFAULT_MODEL = 'gemini-2.5-flash';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const getKey   = () => store.get('gb_key', '').trim();
const getModel = () => store.get('gb_chat_model', DEFAULT_MODEL);

let messages = [];
try { messages = JSON.parse(store.get('gb_chat', '[]')) || []; } catch { messages = []; }
const save = () => store.set('gb_chat', JSON.stringify(messages.slice(-200)));

/* ---------- Anzeige ---------- */
function render(pending = false) {
  const list = $('#list');
  if (!messages.length && !pending) {
    list.innerHTML = `<div class="empty">Schreib unten etwas auf Deutsch (oder in einer anderen Sprache).<br>
      Die KI antwortet mit der englischen Übersetzung.${getKey() ? '' : '<br><br>Zuerst unter ⚙️ den Gemini-Schlüssel eintragen.'}</div>`;
    return;
  }
  list.innerHTML = messages.map((m, i) => {
    if (m.role === 'me') return `<div class="msg me">${esc(m.text)}</div>`;
    if (m.role === 'err') return `<div class="msg err">⚠️ ${esc(m.text)}</div>`;
    return `<div class="msg ai"><span class="lang">English</span>${esc(m.text)}
      <div class="tools"><button data-copy="${i}">Kopieren</button><button data-speak="${i}">🔊 Vorlesen</button></div></div>`;
  }).join('') + (pending ? '<div class="msg ai"><span class="typing"><i></i><i></i><i></i></span></div>' : '');
  const chat = $('#chat'); chat.scrollTop = chat.scrollHeight;
}

$('#list').addEventListener('click', async e => {
  const c = e.target.dataset.copy, s = e.target.dataset.speak;
  if (c != null) {
    try { await navigator.clipboard.writeText(messages[c].text); e.target.textContent = 'Kopiert ✓'; }
    catch { e.target.textContent = 'Nicht möglich'; }
    setTimeout(() => (e.target.textContent = 'Kopieren'), 1500);
  }
  if (s != null && 'speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(messages[s].text); u.lang = 'en-US';
    speechSynthesis.speak(u);
  }
});

/* ---------- KI ---------- */
const SYSTEM_PROMPT = `You are a translator inside a chat app.
Translate the user's message into natural, fluent English.
- Output ONLY the English translation, no explanations, no quotes, no notes.
- Keep the meaning, tone, line breaks and emojis.
- If the message is already English, return it with spelling and grammar corrected.`;

async function translate(text, model = getModel()) {
  const key = getKey();
  if (!key) throw new Error('Kein API-Schlüssel eingetragen. Bitte unter ⚙️ eintragen.');
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
  const body = {
    systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
    contents: [{ role: 'user', parts: [{ text }] }],
    generationConfig: { temperature: 0.2 },
  };
  let res;
  try {
    res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify(body) });
  } catch { throw new Error('Keine Verbindung zur KI. Bist du online?'); }
  const json = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = json.error?.message || res.statusText || 'unbekannt';
    if (res.status === 429) throw new Error('Kostenloses Limit erreicht – bitte kurz warten. (' + msg + ')');
    if (res.status === 401 || res.status === 403 || /API key/i.test(msg))
      throw new Error('API-Schlüssel wird nicht akzeptiert. Bitte unter ⚙️ prüfen. (' + msg + ')');
    if (res.status === 404) throw new Error(`Modell „${model}“ nicht gefunden – bitte unter ⚙️ ein anderes wählen.`);
    throw new Error(`KI-Fehler ${res.status}: ${msg}`);
  }
  const cand = json.candidates?.[0];
  const out = (cand?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('').trim();
  if (!out) throw new Error('Leere Antwort von der KI' + (cand?.finishReason ? ` (${cand.finishReason})` : json.promptFeedback?.blockReason ? ` (${json.promptFeedback.blockReason})` : '') + '.');
  return out;
}

/* ---------- Senden ---------- */
const input = $('#input');
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, innerHeight * 0.4) + 'px'; }
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(pointer:fine)').matches) {
    e.preventDefault(); $('#form').requestSubmit();
  }
});

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  if (!getKey()) { openSettings(); return; }
  messages.push({ role: 'me', text }); save();
  input.value = ''; autosize();
  $('#sendBtn').disabled = true; render(true);
  try { messages.push({ role: 'ai', text: await translate(text) }); }
  catch (err) { console.error(err); messages.push({ role: 'err', text: err.message || String(err) }); }
  save(); $('#sendBtn').disabled = false; render(); input.focus();
});

$('#clearBtn').addEventListener('click', () => {
  if (messages.length && confirm('Ganzen Verlauf löschen?')) { messages = []; save(); render(); }
});

/* ---------- Einstellungen ---------- */
function openSettings() {
  $('#keyIn').value = getKey(); $('#modelIn').value = getModel(); $('#testOut').textContent = '';
  $('#settings').showModal();
}
$('#settingsBtn').addEventListener('click', openSettings);
$('#closeBtn').addEventListener('click', () => $('#settings').close());
$('#saveBtn').addEventListener('click', () => {
  store.set('gb_key', $('#keyIn').value.trim());
  store.set('gb_chat_model', $('#modelIn').value);
  $('#settings').close(); render();
});
$('#testBtn').addEventListener('click', async () => {
  const out = $('#testOut'), old = getKey();
  store.set('gb_key', $('#keyIn').value.trim());
  out.textContent = 'Teste …';
  try { out.textContent = '✅ Klappt: „Guten Morgen“ → „' + await translate('Guten Morgen', $('#modelIn').value) + '“'; }
  catch (err) { out.textContent = '❌ ' + err.message; store.set('gb_key', old); }
});

render();
if (!getKey()) openSettings();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
